name: Build and release pinned-server panel

on:
  push:
    branches: [master]
    paths: ['panel/**', 'install-pin.sh', '.github/workflows/pin-panel.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-panel-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'valisheidaei/regionhop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: panel/go.sum
      - name: Test panel and installer syntax
        run: |
          bash -n install-pin.sh
          cd panel
          go test -count=1 ./...
          go vet ./...
      - name: Build Linux panels
        run: |
          set -euo pipefail
          mkdir -p dist
          cd panel
          for arch in amd64 arm64 arm; do
            name="$arch"
            [ "$arch" != arm ] || name=armv7
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOARM=7 go build -trimpath -ldflags '-s -w -X main.CurrentVersion=1.24.0-pin1' -o "../dist/psi-panel-linux-$name" .
          done
          cd ../dist
          sha256sum psi-panel-linux-* > SHA256SUMS.txt
      - name: Publish panel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="pin-${GITHUB_SHA:0:12}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Pinned-server panel ${GITHUB_SHA:0:12}" --notes-file RELEASE-PIN.md --latest
          fi
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
